<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SolarGrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <img src="assets/images/logo.svg" alt="SolarGrid" width="60" height="60" class="mb-2">
                                <h2 class="fw-bold text-primary">Solar<span class="text-secondary">Grid</span></h2>
                            </a>
                            <p class="text-muted">Welcome back! Please login.</p>
                        </div>
                        <form action="dashboard.html">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com"
                                    required>
                                <label for="emailInput">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="passwordInput" placeholder="Password"
                                    required>
                                <label for="passwordInput">Password</label>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none small">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">Login</button>
                        </form>
                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1">
                            <span class="mx-2 text-muted">OR</span>
                            <hr class="flex-grow-1">
                        </div>
                        <button class="btn btn-outline-danger w-100 mb-2 fw-bold">
                            <i class="bi bi-google me-2"></i> Login with Google
                        </button>
                        <button class="btn btn-outline-primary w-100 fw-bold">
                            <i class="bi bi-facebook me-2"></i> Login with Facebook
                        </button>
                        <div class="text-center mt-4">
                            <p class="mb-0">Don't have an account? <a href="register.html"
                                    class="fw-bold text-primary text-decoration-none">Sign Up</a></p>
                        </div>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted text-decoration-none small"><i
                                    class="bi bi-arrow-left"></i> Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Toggle (Hidden but accessible via JS for consistency if needed, strictly not displayed on login usually but easy to add) -->
    <!-- Simplified for login focus -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
