<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SolarGrid</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <img src="assets/images/logo.svg" alt="SolarGrid" width="40" height="40" class="mb-2">
                                <h4 class="fw-bold"><span class="text-primary">Solar</span><span
                                        class="text-secondary">Grid</span></h4>
                            </a>
                            <p class="text-muted">Create your account today.</p>
                        </div>
                        <form action="login.html">
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="firstName" placeholder="First Name"
                                            required>
                                        <label for="firstName">First Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="lastName" placeholder="Last Name"
                                            required>
                                        <label for="lastName">Last Name</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com"
                                    required>
                                <label for="emailInput">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="passwordInput" placeholder="Password"
                                    required>
                                <label for="passwordInput">Password</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="confirmPasswordInput"
                                    placeholder="Confirm Password" required>
                                <label for="confirmPasswordInput">Confirm Password</label>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label small" for="terms">
                                    I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">Sign Up</button>
                        </form>
                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1">
                            <span class="mx-2 text-muted">OR</span>
                            <hr class="flex-grow-1">
                        </div>
                        <button class="btn btn-outline-danger w-100 mb-2 fw-bold">
                            <i class="bi bi-google me-2"></i> Sign up with Google
                        </button>
                        <button class="btn btn-outline-primary w-100 fw-bold">
                            <i class="bi bi-facebook me-2"></i> Sign up with Facebook
                        </button>
                        <div class="text-center mt-4">
                            <p class="mb-0">Already have an account? <a href="login.html"
                                    class="fw-bold text-primary text-decoration-none">Login</a></p>
                        </div>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted text-decoration-none small"><i
                                    class="bi bi-arrow-left"></i> Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
