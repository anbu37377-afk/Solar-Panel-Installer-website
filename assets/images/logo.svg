<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Circle background for the sun part -->
  <circle cx="50" cy="50" r="45" fill="#2ecc71" opacity="0.1"/>
  
  <!-- The Sun (Top Left) -->
  <circle cx="35" cy="35" r="15" fill="#2ecc71" />
  <g stroke="#2ecc71" stroke-width="4" stroke-linecap="round">
    <line x1="35" y1="10" x2="35" y2="15" />
    <line x1="35" y1="55" x2="35" y2="60" />
    <line x1="10" y1="35" x2="15" y2="35" />
    <line x1="55" y1="35" x2="60" y2="35" />
    <line x1="18" y1="18" x2="22" y2="22" />
    <line x1="48" y1="48" x2="52" y2="52" />
    <line x1="18" y1="52" x2="22" y2="48" />
    <line x1="48" y1="22" x2="52" y2="18" />
  </g>

  <!-- The Panel (Bottom Right) -->
  <path d="M40 50 L90 50 L80 90 L30 90 Z" fill="#0c2b4b" />
  <path d="M40 50 L90 50 L80 90 L30 90 Z" fill="none" stroke="#ffffff" stroke-width="2" />
  
  <!-- Grid Lines on Panel -->
  <line x1="52.5" y1="50" x2="42.5" y2="90" stroke="#ffffff" stroke-width="2" />
  <line x1="65" y1="50" x2="55" y2="90" stroke="#ffffff" stroke-width="2" />
  <line x1="77.5" y1="50" x2="67.5" y2="90" stroke="#ffffff" stroke-width="2" />
  
  <line x1="35" y1="70" x2="85" y2="70" stroke="#ffffff" stroke-width="2" />

</svg>
